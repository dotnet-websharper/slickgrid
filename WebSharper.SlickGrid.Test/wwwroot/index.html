<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebSharper.SlickGrid — sample</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232563eb'/%3E%3Cpath d='M3 4h10v2H3zM3 7h10v2H3zM3 10h10v2H3z' fill='white'/%3E%3C/svg%3E" />
    <script>
        // Apply a previously chosen theme before first paint. Light is the
        // default; the key is shared with Client.fs (themeStorageKey).
        try {
            var t = localStorage.getItem('websharper-slickgrid-theme');
            if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
        } catch (e) { }
    </script>
    <style>
        /* Don't show the not-yet-loaded WebSharper templates. */
        [ws-template], [ws-children-template] { display: none; }
    </style>
    <link rel="stylesheet" type="text/css" href="Scripts/WebSharper.SlickGrid.Test.css" />
    <link rel="stylesheet" type="text/css" href="site.css" />
    <script type="text/javascript" src="Scripts/WebSharper.SlickGrid.Test.head.js"></script>
</head>
<body>
    <header class="app-header">
        <div class="app-titles">
            <h1>WebSharper.SlickGrid</h1>
            <p>SlickGrid 6 bindings for F# — with <a href="https://websharper.com">WebSharper</a></p>
        </div>
        <div class="app-actions">
            <button class="btn theme-toggle" ws-onclick="ToggleTheme" title="Switch between the light and dark theme">${themeLabel}</button>
            <a class="app-source" href="https://github.com/dotnet-websharper/slickgrid">Source</a>
        </div>
    </header>

    <main class="page">
        <div class="toolbar">
            <button class="btn btn-primary" ws-onclick="TogglePin">Pin / unpin first column</button>
            <button class="btn" ws-onclick="ScrollToRow">Scroll to row 250</button>
            <button class="btn" ws-onclick="AddRow">Add row</button>
            <button class="btn" ws-onclick="AutosizeColumns">Auto-size columns</button>
        </div>
        <div id="myGrid" class="slick-container"></div>
        <p class="status">${status}</p>
    </main>

    <script type="module" src="Scripts/WebSharper.SlickGrid.Test.min.js"></script>
</body>
</html>
